name: avarra_workspace
description: AVARRA application and runtime workspace.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2

workspace:
  - apps/*
  - packages/*

dev_dependencies:
  flutter_lints: ^6.0.0

# Thermion 0.5.0-pre.5 is pinned to one upstream commit because its Windows
# single-queue Vulkan serialization fix has not been published to pub.dev yet.
dependency_overrides:
  thermion_dart:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: caad37835e7d379621247b24b7de9d84071bd474
      path: thermion_dart
