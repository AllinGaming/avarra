name: avarra_forge
description: Desktop world-authoring application for AVARRA.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  avarra_client: ^0.1.0
  avarra_content: ^0.1.0
  avarra_core: ^0.1.0
  avarra_creator_api: ^0.1.0
  avarra_isometric: ^0.1.0
  avarra_thermion_bridge: ^0.1.0
  avarra_world: ^0.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/cube/
    - assets/models/gothic/
    - assets/models/gothic/materials/
