// AVARRA compatibility build for pinned Thermion 0.5.0-pre.5.
//
// Upstream still applies kotlin-android and carries an AGP 7.3 buildscript.
// Flutter's AGP 9 migration requires plugins to stop applying KGP and use the
// compilerOptions DSL. This file changes build configuration only; Thermion's
// Dart, Kotlin, C++, and platform source remains the immutable upstream pin.

group 'dev.thermion.android'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

android {
    namespace 'dev.thermion.android'
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 22
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
}
