name: avarra_game
description: Player-facing AVARRA application shell.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  avarra_client: ^0.1.0
  avarra_core: ^0.1.0
  avarra_ecs: ^0.1.0
  avarra_gameplay: ^0.1.0
  avarra_isometric: ^0.1.0
  avarra_physics: ^0.1.0
  avarra_streaming: ^0.1.0
  avarra_thermion_bridge: ^0.1.0
  avarra_world: ^0.1.0
  vector_math: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/cube/
    - assets/worlds/
